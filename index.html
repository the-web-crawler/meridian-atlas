<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meridian — World Metrics Atlas</title>
    <meta name="description" content="A choropleth atlas of living world metrics. Color countries by GDP, population, life expectancy, HDI, carbon, or internet access. Pan, zoom, and inspect any nation." />
    <meta name="theme-color" content="#0b1116" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Meridian home">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="6" fill="#0b1116"></rect>
            <g fill="none" stroke="#e8e4d9" stroke-linecap="round">
              <circle cx="16" cy="16" r="10.5" stroke-width="1.1"></circle>
              <ellipse cx="16" cy="16" rx="4.2" ry="10.5" stroke-width="0.85"></ellipse>
              <ellipse cx="16" cy="16" rx="10.5" ry="4.2" stroke-width="0.85"></ellipse>
            </g>
            <circle cx="16" cy="16" r="2.1" fill="#3d9a8c"></circle>
          </svg>
          <span class="brand-text">
            <span class="brand-name">Meridian</span>
            <span class="brand-tag">World metrics atlas</span>
          </span>
        </a>
        <div class="metrics" id="metrics" role="toolbar" aria-label="Choose a metric"></div>
        <div class="search">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-3.5-3.5"></path>
          </svg>
          <input id="search" type="search" placeholder="Find a country" autocomplete="off" aria-label="Find a country" />
          <div id="search-results" class="search-list" role="listbox"></div>
        </div>
      </header>

      <main class="stage" id="stage">
        <p class="status" id="status">Loading atlas…</p>
        <svg id="map" role="img" aria-label="World choropleth map"></svg>

        <aside class="hud legend" aria-label="Color legend">
          <h2 id="legend-title">GDP per capita</h2>
          <div class="legend-bar" id="legend-bar"></div>
          <div class="legend-ticks">
            <span id="legend-min">Low</span>
            <span id="legend-max">High</span>
          </div>
          <div class="legend-note"><span class="swatch"></span> No sample data</div>
        </aside>

        <div class="hud zoom" role="group" aria-label="Map controls">
          <button id="zoom-in" title="Zoom in" aria-label="Zoom in">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
          <button id="zoom-out" title="Zoom out" aria-label="Zoom out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"></path></svg>
          </button>
          <button id="zoom-reset" title="Reset view" aria-label="Reset view">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v8M8 12h8" stroke-width="1.4"></path></svg>
          </button>
        </div>

        <div id="tooltip" class="tooltip" role="tooltip"></div>

        <aside id="panel" class="panel" aria-hidden="true">
          <div class="panel-head">
            <div>
              <div class="panel-kicker" id="panel-region">Region</div>
              <h2 id="panel-name">Country</h2>
            </div>
            <button class="close" id="close-panel" aria-label="Close details">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
          <div class="panel-body" id="panel-body"></div>
        </aside>

        <div class="loader" id="loader">
          <p>Drawing the atlas</p>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
